[env:cyd_4inch]
platform  = espressif32
board     = esp32dev
framework = arduino

; ─── Flash / particiones ─────────────────────────────────────────────────────
; El firmware pesa ~900 KB + overhead; usamos un esquema custom 3 MB app
board_build.flash_size       = 4MB
board_build.partitions       = partitions_4mb_app.csv

; ─── Monitor ─────────────────────────────────────────────────────────────────
monitor_speed   = 115200
upload_speed    = 921600

; ─── Librerías ───────────────────────────────────────────────────────────────
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

; ─── Flags de compilación ────────────────────────────────────────────────────
build_flags =
    ; Nivel de log ESP-IDF
    -DCORE_DEBUG_LEVEL=3

    ; ── Configuración del firmware (reemplaza Kconfig) ──
    -DCONFIG_SCAN_MAX_AP=20
    -DCONFIG_MGMT_AP_SSID=\"ChL-CyberKit\"
    -DCONFIG_MGMT_AP_PASSWORD=\"CyberKit2026\"
    -DCONFIG_MGMT_AP_CHANNEL=3
    -DCONFIG_MGMT_AP_MAX_CONNECTIONS=1
    -DCONFIG_MGMT_AP_AUTH_ON=1

    ; ── TFT_eSPI — CYD 4" E32R40T (ST7796S, 320×480) ──
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000

    ; ── Fuentes TFT_eSPI ──
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

    ; ── Directorio fuente adicional ──
    -I src

    ; ── Linker: permite múltiples definiciones de ieee80211_raw_frame_sanity_check ──
    ; En Arduino-ESP32, libnet80211.a tiene este símbolo como no-débil (a diferencia
    ; del ESP-IDF puro). Con --allow-multiple-definition, el linker usa la PRIMERA
    ; definición encontrada, que es la de wsl_bypasser.c (return 0 = bypass).
    -Wl,--allow-multiple-definition
